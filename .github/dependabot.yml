version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/TradingAddin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "nuget"]
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns:
          - "*"
